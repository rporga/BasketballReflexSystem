name: Build Next.js application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

      - name: Verify ESPN live feeds
        run: node scripts/check-data.mjs

      - name: Verify quarter-level scoring data
        run: node scripts/check-quarter-feed.mjs

      - name: Verify injury report data
        run: node scripts/check-injuries.mjs

      - name: Verify live deployed intelligence API
        run: node scripts/test-live-intelligence.mjs
