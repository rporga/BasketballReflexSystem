name: Smoke test production Dime AI
on:
  push:
    paths:
      - '.github/workflows/test-dime.yml'
      - 'scripts/test-dime.mjs'
      - 'app/api/dime/route.js'
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Dime streamed LLM answer from production
        run: node scripts/test-dime.mjs
